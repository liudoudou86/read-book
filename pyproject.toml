[project]
name = "read-book"
version = "0.2.0"
description = "读书 Skill - 基于分析阅读法的书籍深度分析与专属 AI Skill 生成工具"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pypdf>=5.9.0",
]

[project.optional-dependencies]
pdf = [
    "pdfminer.six>=20221105",
]
epub = [
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
]
docx = [
    "python-docx>=1.1.0",
]
all = [
    "pdfminer.six>=20221105",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "python-docx>=1.1.0",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
